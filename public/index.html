<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />

    <link
      rel="icon"
      href="%PUBLIC_URL%/favicon.ico"
    />

    <!--
      ✅ 기본 viewport

      중요:
      - PC 화면 배율에는 영향 없음
      - 태블릿 일반 브라우저와 홈 화면 실행 시
        동일한 CSS viewport 기준 사용
      - 실제 67% 축소는 TrezoSidebar에서만 처리
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <!-- ✅ 모바일 / 웹앱 실행 설정 -->
    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />

    <!-- ✅ Android / 브라우저 테마 -->
    <meta
      name="theme-color"
      content="#ff6e00"
    />

    <meta
      name="description"
      content="한남주택관리 ERP 시스템"
    />

    <!-- ✅ 홈 화면 아이콘 -->
    <link
      rel="apple-touch-icon"
      href="%PUBLIC_URL%/logo192.png"
    />

    <!-- ✅ PWA manifest -->
    <link
      rel="manifest"
      href="%PUBLIC_URL%/manifest.json"
    />

    <!-- RemixIcon CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css"
      rel="stylesheet"
    />

    <!-- Spoqa Han Sans -->
    <link
      href="https://spoqa.github.io/spoqa-han-sans/css/SpoqaHanSansNeo.css"
      rel="stylesheet"
    />

    <!-- ✅ 제목 -->
    <title>한남주택관리 ERP</title>

    <!-- ✅ Google Identity Services SDK -->
    <script
      src="https://accounts.google.com/gsi/client"
      async
      defer
    ></script>
  </head>

  <body>
    <noscript>
      한남주택관리 ERP를 사용하려면 JavaScript를 활성화해야 합니다.
    </noscript>

    <div id="root"></div>
  </body>
</html>
